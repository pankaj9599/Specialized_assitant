version: "3.9"

services:

  ai-assistant:
    build: .
    container_name: ai-assistant

    env_file:
      - .env

    depends_on:
      - mongodb

    volumes:
      - ./data/vector_db:/app/data/vector_db

  mongodb:
    image: mongo:8

    container_name: mongodb

    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: